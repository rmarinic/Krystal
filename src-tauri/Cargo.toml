[package]
name = "krystal"
version = "0.37.0"
description = "Krystal — a local Claude Code chat app (Tauri)"
authors = ["Krystal"]
edition = "2021"
rust-version = "1.77"

# The desktop binary. Single-binary desktop app (no mobile/lib split).
[[bin]]
name = "krystal"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# Self-update: check GitHub Releases on launch, download + verify a signed
# update, then relaunch. `process` provides the relaunch after install.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# A Windows toast when a reply lands (or stops to ask) while the window is in
# the background — see `commands::notify`.
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Fetch the live Anthropic model catalogue (GET /v1/models) so the picker stays
# current, and talk to Krystal Cloud (src/cloud/api.rs). rustls (no native TLS
# dep); reqwest is already in the tree via the updater plugin, so this adds little.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["process", "io-util", "rt-multi-thread", "macros", "time", "sync"] }
# Krystal Cloud's device token lives in Windows Credential Manager, never on
# disk in the clear (see src/cloud/vault.rs).
keyring = { version = "3", features = ["windows-native"] }
# The linked computer's live connection to Krystal Cloud (wss://…/device, see
# src/cloud/presence.rs). rustls with the same webpki roots reqwest uses, so the
# TLS stack is the one already in the tree.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["clock"] }
# Discord Rich Presence — pure-Rust IPC client (no native deps). Talks to the
# local Discord desktop client to show the active project on the user's profile.
discord-rich-presence = "0.2"

[dev-dependencies]
# `tauri/test` gives us a mock app to hang AppState off, so the command bridge in
# src/remote/ can be driven for real in a test. A dev-dependency, so the shipped
# binary never carries it.
tauri = { version = "2", features = ["test"] }
# Paused, auto-advancing time: the presence tests run hours of heartbeats and
# backoff in microseconds (src/cloud/presence.rs).
tokio = { version = "1", features = ["test-util"] }

# Smaller, faster release binary for the one-click app.
[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
